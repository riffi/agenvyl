<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How Agenvyl connects coding agents in one room</title>
  <desc id="desc">A message to one or several coding agents enters one Agenvyl room. The agents share the room conversation and Git-backed Workspace. Their answers and file versions stay connected for review, handoff, and follow-up.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Active Room Gradient -->
    <linearGradient id="centerCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- Outer Canvas Background -->
  <rect width="1200" height="520" rx="24" fill="url(#bgGrad)"/>
  <rect width="1198" height="518" x="1" y="1" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Decorative Ambient Glows -->
  <circle cx="200" cy="100" r="180" fill="#6366F1" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="250" r="220" fill="#8B5CF6" opacity="0.06" filter="url(#glow)"/>
  <circle cx="1000" cy="100" r="180" fill="#3B82F6" opacity="0.08" filter="url(#glow)"/>

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="24" fill="#F8FAFC" x="0" y="0">One room connects your agents, conversation, and files</text>
    <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="14" fill="#94A3B8" x="0" y="24">Ask the coding agents you already use to work from shared context instead of separate terminals and chats.</text>
  </g>

  <!-- ==================== LEFT CARD: YOUR MESSAGE ==================== -->
  <g filter="url(#shadow)" transform="translate(60, 125)">
    <rect width="260" height="250" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="260" height="250" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Header Icon -->
    <rect x="20" y="20" width="40" height="40" rx="10" fill="url(#purpleGradient)"/>
    <path d="M32 37 L32 41 L36 38 C37.2 38.5 38.5 38.8 40 38.8 C45.5 38.8 50 35.2 50 30.8 C50 26.4 45.5 22.8 40 22.8 C34.5 22.8 30 26.4 30 30.8 C30 33.2 31.4 35.4 33.7 36.9 Z" transform="translate(0 8)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

    <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="16" fill="#F1F5F9" x="72" y="45">Your message</text>

    <!-- Description -->
    <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="13" fill="#94A3B8" x="20" y="85">Ask one agent, several,</text>
    <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="13" fill="#94A3B8" x="20" y="105">or everyone at once.</text>

    <!-- Command Prompt Card -->
    <g transform="translate(20, 135)">
      <rect width="220" height="85" rx="12" fill="#090D16" stroke="#1E293B" stroke-width="1.5"/>

      <!-- Window dots -->
      <circle cx="16" cy="16" r="3.5" fill="#EF4444"/>
      <circle cx="28" cy="16" r="3.5" fill="#F59E0B"/>
      <circle cx="40" cy="16" r="3.5" fill="#10B981"/>

      <!-- Prompt text -->
      <text font-family="Consolas, 'Segoe UI', monospace" font-size="12" x="16" y="46">
        <tspan fill="#8B5CF6" font-weight="700">@all</tspan>
        <tspan fill="#E2E8F0"> Review this project</tspan>
      </text>
      <text font-family="Consolas, 'Segoe UI', monospace" font-size="10" fill="#64748B" x="16" y="66">and propose refactoring</text>
    </g>
  </g>

  <!-- Arrow 1 (Left to Center) -->
  <g transform="translate(320, 250)">
    <line x1="5" y1="0" x2="50" y2="0" stroke="url(#lineGrad)" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <!-- ==================== CENTER CARD: ONE AGENVYL ROOM ==================== -->
  <g filter="url(#shadow)" transform="translate(380, 125)">
    <rect width="440" height="250" rx="18" fill="url(#centerCardGrad)" stroke="#4338CA" stroke-width="1.5"/>
    <rect width="440" height="250" rx="18" fill="none" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Header Icon -->
    <rect x="20" y="20" width="40" height="40" rx="10" fill="url(#purpleGradient)"/>
    <path d="M33 27 L40 23 L47 27 L40 31 Z M33 33 L40 37 L47 33 M33 38 L40 42 L47 38" transform="translate(0 7.5)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="16" fill="#F1F5F9" x="72" y="40">One Agenvyl room</text>
    <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="12" fill="#818CF8" x="72" y="56">Every handoff preserves full project context</text>

    <!-- Feature Row: Conversation & Workspace -->
    <g transform="translate(20, 78)">
      <!-- Conversation Badge -->
      <rect width="194" height="52" rx="10" fill="#1E1B4B" fill-opacity="0.7" stroke="#312E81" stroke-width="1"/>
      <circle cx="26" cy="26" r="14" fill="#4C1D95"/>
      <path d="M22 26 H30 M22 23 H28 M22 29 H26" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>
      <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="13" fill="#F8FAFC" x="48" y="23">Conversation</text>
      <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="11" fill="#94A3B8" x="48" y="38">Answers &amp; decisions</text>

      <!-- Workspace Badge -->
      <rect x="206" y="0" width="194" height="52" rx="10" fill="#0C4A6E" fill-opacity="0.5" stroke="#075985" stroke-width="1"/>
      <circle cx="232" cy="26" r="14" fill="#0369A1"/>
      <path d="M226 23 L230 23 L232 25 L238 25 L238 30 L226 30 Z" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linejoin="round"/>
      <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="13" fill="#F8FAFC" x="254" y="23">Workspace</text>
      <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="400" font-size="11" fill="#94A3B8" x="254" y="38">Shared Git files &amp; state</text>
    </g>

    <!-- Active Agents Grid (4 Agent Chips) -->
    <g transform="translate(20, 142)">
      <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="0.5" x="0" y="12">ACTIVE ROOM AGENTS</text>

      <g transform="translate(0, 22)">
        <!-- Agent 1: @gemini_friend -->
        <g transform="translate(0, 0)">
          <rect width="94" height="56" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
          <circle cx="16" cy="28" r="9.5" fill="url(#purpleGradient)"/>
          <text font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" x="16" y="31.5" text-anchor="middle">G</text>
          <text font-family="'Segoe UI', sans-serif" font-weight="600" font-size="9" fill="#E2E8F0" x="30" y="24">@gemini</text>
          <text font-family="'Segoe UI', sans-serif" font-weight="400" font-size="8.5" fill="#94A3B8" x="30" y="37">Friend</text>
        </g>

        <!-- Agent 2: @sol -->
        <g transform="translate(102, 0)">
          <rect width="94" height="56" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
          <circle cx="16" cy="28" r="9.5" fill="url(#blueGradient)"/>
          <text font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" x="16" y="31.5" text-anchor="middle">S</text>
          <text font-family="'Segoe UI', sans-serif" font-weight="600" font-size="9" fill="#E2E8F0" x="30" y="24">@sol</text>
          <text font-family="'Segoe UI', sans-serif" font-weight="400" font-size="8.5" fill="#94A3B8" x="30" y="37">Sol</text>
        </g>

        <!-- Agent 3: @fable -->
        <g transform="translate(204, 0)">
          <rect width="94" height="56" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
          <circle cx="16" cy="28" r="9.5" fill="url(#emeraldGradient)"/>
          <text font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" x="16" y="31.5" text-anchor="middle">F</text>
          <text font-family="'Segoe UI', sans-serif" font-weight="600" font-size="9" fill="#E2E8F0" x="30" y="24">@fable</text>
          <text font-family="'Segoe UI', sans-serif" font-weight="400" font-size="8.5" fill="#94A3B8" x="30" y="37">Fable</text>
        </g>

        <!-- Agent 4: @glm -->
        <g transform="translate(306, 0)">
          <rect width="94" height="56" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
          <circle cx="16" cy="28" r="9.5" fill="url(#amberGradient)"/>
          <text font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" x="16" y="31.5" text-anchor="middle">M</text>
          <text font-family="'Segoe UI', sans-serif" font-weight="600" font-size="9" fill="#E2E8F0" x="30" y="24">@glm</text>
          <text font-family="'Segoe UI', sans-serif" font-weight="400" font-size="8.5" fill="#94A3B8" x="30" y="37">GLM</text>
        </g>

      </g>
    </g>
  </g>

  <!-- Arrow 2 (Center to Right) -->
  <g transform="translate(820, 250)">
    <line x1="5" y1="0" x2="50" y2="0" stroke="url(#lineGrad)" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <!-- ==================== RIGHT CARD: CONNECTED RESULTS ==================== -->
  <g filter="url(#shadow)" transform="translate(880, 125)">
    <rect width="260" height="250" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="260" height="250" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Header Icon -->
    <rect x="20" y="20" width="40" height="40" rx="10" fill="url(#blueGradient)"/>
    <path d="M30 30 L37 36 L50 23" transform="translate(0 10)" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="16" fill="#F1F5F9" x="72" y="45">Connected results</text>

    <!-- Checklist Items -->
    <g transform="translate(20, 85)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="10" fill="#312E81"/>
        <path d="M8 12 L11 15 L16 9" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="13" fill="#F1F5F9" x="32" y="16">Agent answers &amp; diffs</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 42)">
        <circle cx="12" cy="12" r="10" fill="#0C4A6E"/>
        <path d="M8 12 L11 15 L16 9" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="13" fill="#F1F5F9" x="32" y="16">Git file versions</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 84)">
        <circle cx="12" cy="12" r="10" fill="#064E3B"/>
        <path d="M8 12 L11 15 L16 9" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" font-size="13" fill="#F1F5F9" x="32" y="16">Continuous context</text>
      </g>
    </g>
  </g>

  <!-- ==================== LOOP ARROW & BOTTOM PILL ==================== -->
  <path d="M 1010 375 V 435 Q 1010 445 995 445 H 205 Q 190 445 190 435 V 383" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- Center Pill Badge -->
  <g filter="url(#shadow)" transform="translate(440, 425)">
    <rect width="320" height="40" rx="20" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
    <path d="M26 20 C26 16.7 28.7 14 32 14 C34.5 14 36.6 15.5 37.5 17.6 M38 20 C38 23.3 35.3 26 32 26 C29.5 26 27.4 24.5 26.5 22.4" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M37.5 14 V 18 H 33.5" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26.5 26 V 22 H 30.5" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="12" fill="#C7D2FE" x="175" y="25" text-anchor="middle">Review · Hand off · Continue context</text>
  </g>
</svg>
