<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How Agenvyl coordinates Work and Plan agents</title>
  <desc id="desc">A message enters a mode-aware room scheduler. Plan agents may run in parallel. Work waits for them, then runs alone against the shared Git-backed Workspace. Answers return to the shared conversation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d5ef7"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172235" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#6d5ef7"/>
    </marker>
    <style>
      .heading{font:700 25px 'Segoe UI',sans-serif;fill:#172235}
      .label{font:700 15px 'Segoe UI',sans-serif;fill:#172235}
      .body{font:400 13px 'Segoe UI',sans-serif;fill:#536078}
      .small{font:600 12px 'Segoe UI',sans-serif;fill:#6d5ef7}
      .card{fill:#fff;stroke:#d9def0;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#background)"/>
  <text x="60" y="62" class="heading">Plan explores in parallel. Work stays ordered.</text>
  <text x="60" y="88" class="body">Responders share pre-round conversation context and one live Git-backed Workspace.</text>

  <g filter="url(#shadow)">
    <rect class="card" x="60" y="140" width="230" height="150" rx="20"/>
    <circle cx="98" cy="180" r="18" fill="#ede9fe"/>
    <path d="M89 180h18M98 171v18" stroke="#6d5ef7" stroke-width="3" stroke-linecap="round"/>
    <text x="128" y="178" class="label">Message</text>
    <text x="88" y="220" class="body">@architect @builder</text>
    <text x="88" y="244" class="body">@reviewer Review and build.</text>
    <text x="88" y="270" class="small">Creates mode-aware runs</text>
  </g>

  <path d="M290 215h70" stroke="#6d5ef7" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect class="card" x="370" y="120" width="360" height="230" rx="20"/>
    <text x="400" y="158" class="label">Room scheduler</text>
    <g>
      <rect x="400" y="180" width="300" height="42" rx="12" fill="#ede9fe"/>
      <circle cx="425" cy="201" r="13" fill="#6d5ef7"/>
      <text x="421" y="206" style="font:700 12px 'Segoe UI',sans-serif;fill:#fff">P</text>
      <text x="450" y="206" class="body">Plan · Architect · starts now</text>
    </g>
    <g>
      <rect x="400" y="232" width="300" height="42" rx="12" fill="#eef5ff"/>
      <circle cx="425" cy="253" r="13" fill="#3b82f6"/>
      <text x="421" y="258" style="font:700 12px 'Segoe UI',sans-serif;fill:#fff">P</text>
      <text x="450" y="258" class="body">Plan · Reviewer · starts now</text>
    </g>
    <g>
      <rect x="400" y="284" width="300" height="42" rx="12" fill="#f1f5f9"/>
      <circle cx="425" cy="305" r="13" fill="#64748b"/>
      <text x="419" y="310" style="font:700 12px 'Segoe UI',sans-serif;fill:#fff">W</text>
      <text x="450" y="310" class="body">Work · Builder · waits, then runs alone</text>
    </g>
  </g>

  <path d="M730 215h70" stroke="#6d5ef7" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect class="card" x="810" y="140" width="330" height="150" rx="20"/>
    <rect x="842" y="172" width="58" height="58" rx="14" fill="url(#accent)"/>
    <path d="M855 192h32M855 203h24M855 214h28" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="922" y="190" class="label">Shared Git Workspace</text>
    <text x="922" y="216" class="body">Direct writes and checkpoints</text>
    <text x="842" y="260" class="small">No publication or conflict-resolution stage</text>
  </g>

  <path d="M975 290v70H220v-50" fill="none" stroke="#6d5ef7" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect class="card" x="60" y="370" width="1080" height="92" rx="20"/>
    <text x="90" y="408" class="label">Shared conversation</text>
    <text x="90" y="435" class="body">Answers and exact changed-file versions return to the room. Send a follow-up message when one agent should review peer answers.</text>
    <rect x="935" y="393" width="165" height="40" rx="20" fill="#ede9fe"/>
    <text x="963" y="418" class="small">Other rooms can run too</text>
  </g>
</svg>
