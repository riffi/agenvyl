<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Agenvyl woven A glyph</title>
  <desc id="desc">Three folded bands form an angular letter A and a shared central gateway.</desc>
  <defs>
    <linearGradient id="leftBand" x1="88" y1="440" x2="269" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3156D9"/>
      <stop offset="0.55" stop-color="#4F6EF7"/>
      <stop offset="1" stop-color="#7468FF"/>
    </linearGradient>
    <linearGradient id="rightBand" x1="252" y1="72" x2="424" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24304A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bridgeBand" x1="120" y1="350" x2="388" y2="314" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F9F91"/>
      <stop offset="1" stop-color="#34CDB2"/>
    </linearGradient>
  </defs>

  <!-- Left lane: a rising ribbon with a deliberate cut-paper silhouette. -->
  <path d="M45 440 206 101c10-21 27-33 50-33l37 78-158 294H45Z" fill="url(#leftBand)"/>

  <!-- Right lane folds over the apex, then descends as the structural spine. -->
  <path d="M467 440 306 101c-10-21 -27-33 -50-33l-37 78 158 294H467Z" fill="url(#rightBand)"/>

  <!-- The shared workspace: a third band woven through both agent lanes. -->
  <path d="M145 286 367 286 416 390 96 390 145 286Z" fill="url(#bridgeBand)"/>

  <!-- Over-under folds make the construction read as a physical weave. -->
  <path d="M145 286 195 390 96 390Z" fill="#087F79"/>
  <path d="M367 286 416 390 317 390Z" fill="#67E3C7"/>

  <!-- Reassert the legs over alternating ends of the bridge. -->
  <path d="M45 440 118 286 218 286 135 440Z" fill="url(#leftBand)"/>
  <path d="M294 286 377 440 467 440 394 286Z" fill="url(#rightBand)"/>

  <!-- Small facet highlights remain legible at app-icon sizes. -->
  <path d="M118 286 206 101c10-21 27-33 50-33l-25 56-78 162h-35Z" fill="#FFFFFF" opacity="0.1"/>
  <path d="M343 390 377 440 467 440 448 390Z" fill="#000000" opacity="0.12"/>
</svg>
