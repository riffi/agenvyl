# Development and custom-deployment template. A personal portable installation
# creates and updates connector.yaml through Configure connectors or `agenvyl setup`.
# Keep tokens, passwords, provider credentials, and command overrides out of YAML.
version: 1

listen:
  host: 127.0.0.1
  port: 4310

workspaces:
  # Empty means ${AGENVYL_WORKSPACE_ROOT} or the XDG data path used by Core.
  roots: []

instances:
  - id: local-hermes
    type: hermes
    enabled: true
  - id: local-opencode
    type: opencode
    enabled: false
    # true: Connector owns the server process. false: attach to an external server.
    managed: false
    # Optional non-secret URL override for this instance, for example:
    # endpoint: http://127.0.0.1:4096
    # Absolute OpenCode-server paths that agents may request outside a run workspace.
    externalDirectoryRoots: []
  - id: local-codex
    type: codex
    enabled: false
  - id: local-claude
    type: claude
    enabled: false
    # Set only after the exact CLAUDE OAUTH confirmation. Prefer API/cloud auth.
    allowSubscriptionOAuth: false
  - id: local-antigravity
    type: antigravity
    enabled: false
  - id: local-cursor
    type: cursor
    enabled: false
