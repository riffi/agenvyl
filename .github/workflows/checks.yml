name: Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "spec/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "spec/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://agenvyl_ci:agenvyl_ci@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agenvyl_ci
          POSTGRES_PASSWORD: agenvyl_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenvyl_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check without checkout pollution
        shell: bash
        run: |
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/status-before"
          npm run check:local
          npm run test:e2e:codex
          npm run test:supervisor
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/status-after"
          diff -u "$RUNNER_TEMP/status-before" "$RUNNER_TEMP/status-after"
      - run: npm run build
      - run: sh -n packaging/install.sh
