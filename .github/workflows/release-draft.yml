name: Release Draft

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: GitHub release classification and manifest channel
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable
      postgres_artifact_run_id:
        description: PostgreSQL Runtime run ID used when native caches miss
        required: false
        type: string
      rebuild_postgres:
        description: Rebuild PostgreSQL payloads
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: source
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          tag_sha=""
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_sha=$(git rev-parse "$tag^{commit}")
          fi
          node scripts/release-policy.mjs source "$GITHUB_REF" "$GITHUB_SHA" "$tag_sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  portable:
    needs: policy
    uses: ./.github/workflows/portable.yml
    with:
      target: all
      postgres_artifact_run_id: ${{ inputs.postgres_artifact_run_id }}
      rebuild_postgres: ${{ inputs.rebuild_postgres }}

  draft-release:
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release version and notes
        run: npm run release:verify
      - uses: actions/download-artifact@v4
        with:
          name: agenvyl-linux-x64
          path: artifacts/portable
      - uses: actions/download-artifact@v4
        with:
          name: agenvyl-linux-arm64
          path: artifacts/portable
      - uses: actions/download-artifact@v4
        with:
          name: agenvyl-darwin-x64
          path: artifacts/portable
      - uses: actions/download-artifact@v4
        with:
          name: agenvyl-darwin-arm64
          path: artifacts/portable
      - uses: actions/download-artifact@v4
        with:
          name: agenvyl-windows-x64
          path: artifacts/portable
      - id: metadata
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          release_type="${{ inputs.release_type }}"
          if [ "$release_type" = stable ]; then
            channel=stable
            prerelease=false
            title="Agenvyl v$version"
          else
            channel=preview
            prerelease=true
            title="Agenvyl v$version Technical Preview"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=docs/releases/v$version.md" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
      - name: Build release manifest and shell index
        shell: bash
        run: >-
          node scripts/release-manifest.mjs
          --version "${{ steps.metadata.outputs.version }}"
          --channel "${{ steps.metadata.outputs.channel }}"
          --base-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.metadata.outputs.tag }}/"
          artifacts/portable/agenvyl-${{ steps.metadata.outputs.version }}-linux-x64.tar.xz
          artifacts/portable/agenvyl-${{ steps.metadata.outputs.version }}-linux-arm64.tar.xz
          artifacts/portable/agenvyl-${{ steps.metadata.outputs.version }}-darwin-x64.zip
          artifacts/portable/agenvyl-${{ steps.metadata.outputs.version }}-darwin-arm64.zip
          artifacts/portable/agenvyl-${{ steps.metadata.outputs.version }}-windows-x64.zip
      - name: Validate installer syntax
        run: sh -n packaging/install.sh
      - name: Assemble supply-chain assets
        shell: bash
        run: |
          cp artifacts/portable/agenvyl-* artifacts/release/
          cp packaging/install.sh packaging/install.ps1 artifacts/release/
          cp docs/user-guide/trust-and-security.md artifacts/release/TRUST.md
          npm sbom --package-lock-only --omit=dev --sbom-format cyclonedx > artifacts/release/agenvyl-sbom.cdx.json
          node -e "const fs=require('node:fs'); JSON.parse(fs.readFileSync('artifacts/release/agenvyl-sbom.cdx.json','utf8'))"
          (cd artifacts/release && sha256sum agenvyl-* install.sh install.ps1 TRUST.md > SHA256SUMS)
      - name: Attest release build provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/release/*
      - name: Verify release build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for asset in artifacts/release/*; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-draft.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF"
          done
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.metadata.outputs.notes }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>/dev/null || true
          tag_sha=""
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          fi
          node scripts/release-policy.mjs source "$GITHUB_REF" "$GITHUB_SHA" "$tag_sha"
          if ! release_json=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,targetCommitish 2>/dev/null); then
            create_args=(
              "$RELEASE_TAG"
              --draft
              --target "$GITHUB_SHA"
              --title "$RELEASE_TITLE"
              --notes-file "$RELEASE_NOTES"
            )
            if [ "$RELEASE_PRERELEASE" = true ]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          else
            target=$(printf '%s\n' "$release_json" | jq -r '.targetCommitish')
            target_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq '.sha')
            is_draft=$(printf '%s\n' "$release_json" | jq -r '.isDraft')
            is_prerelease=$(printf '%s\n' "$release_json" | jq -r '.isPrerelease')
            policy=$(jq -cn --argjson exists true --argjson isDraft "$is_draft" --argjson isPrerelease "$is_prerelease" --arg targetSha "$target_sha" --argjson expectedPrerelease "$RELEASE_PRERELEASE" --arg sha "$GITHUB_SHA" '{exists:$exists,isDraft:$isDraft,isPrerelease:$isPrerelease,targetSha:$targetSha,expectedPrerelease:$expectedPrerelease,sha:$sha}')
            node scripts/release-policy.mjs draft "$policy"

            gh release edit "$RELEASE_TAG" \
              --draft \
              --title "$RELEASE_TITLE" \
              --notes-file "$RELEASE_NOTES"
          fi
      - name: Upload verified draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" --clobber artifacts/release/*
